<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <meta name="color-scheme" content="dark" />
  <title>CodeCraft 正在启动</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      /* 无黑幕：整页完全透明，仅中央内容悬浮，不影响用户的其他内容与操作 */
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      color: #e5e7eb;
      user-select: none;
      cursor: default;
      opacity: 1;
      transition: opacity 0.36s ease;
    }
    /* 启动完成 → 整体淡出 */
    body.done { opacity: 0; }

    /* ── 背景柔光（极淡的品牌光感，为文字提供衬托，非幕布）── */
    .halo { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }

    .halo-purple {
      width: min(92vw, 520px); aspect-ratio: 1;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(139, 92, 246, 0.20) 0%, rgba(99, 102, 241, 0.08) 42%, transparent 70%);
      animation: haloBreath 6s ease-in-out infinite;
    }
    .halo-cyan {
      width: min(60vw, 340px); aspect-ratio: 1;
      left: 30%; top: 32%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.10) 0%, transparent 68%);
      animation: haloDrift 11s ease-in-out infinite alternate;
    }
    @keyframes haloBreath {
      0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.06); }
    }
    @keyframes haloDrift {
      from { transform: translate(0, 0) scale(1);         opacity: 0.55; }
      to   { transform: translate(30px, 20px) scale(1.15); opacity: 1; }
    }

    /* ── 舞台（窗口内整体居中）── */
    .stage {
      position: relative; z-index: 1;
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      animation: stageIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes stageIn {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }

    /* ── CodeCraft 艺术字 ── */
    .logo {
      font-size: 82px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.1;
      background-image: linear-gradient(100deg,
        #c4b5fd 0%, #8b5cf6 18%, #6366f1 36%, #38bdf8 52%,
        #8b5cf6 70%, #a78bfa 84%, #c4b5fd 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: logoFlow 9s linear infinite, logoGlow 4.5s ease-in-out infinite;
    }
    @keyframes logoFlow {
      0%   { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    /* 深色投影（浅色桌面上可读）+ 品牌光晕（深色桌面上亮眼） */
    @keyframes logoGlow {
      0%, 100% {
        filter: drop-shadow(0 3px 14px rgba(8, 6, 16, 0.55))
                drop-shadow(0 0 22px rgba(139, 92, 246, 0.40))
                drop-shadow(0 10px 44px rgba(56, 189, 248, 0.14));
      }
      50% {
        filter: drop-shadow(0 3px 14px rgba(8, 6, 16, 0.55))
                drop-shadow(0 0 36px rgba(139, 92, 246, 0.62))
                drop-shadow(0 10px 54px rgba(56, 189, 248, 0.22));
      }
    }

    /* ── 启动中… ── */
    .launching {
      margin-top: 22px;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.42em;
      color: #eef1f7;
      text-shadow: 0 1px 12px rgba(8, 6, 16, 0.85), 0 0 3px rgba(8, 6, 16, 0.6);
    }
    .dots i {
      font-style: normal;
      opacity: 0.18;
      animation: dotBlink 1.3s infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.18s; }
    .dots i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dotBlink {
      0%, 100% { opacity: 0.18; }
      45%      { opacity: 1; }
    }

    /* ── 进度条 ── */
    .progress-row {
      margin-top: 40px;
      display: flex; align-items: center; gap: 16px;
    }
    .progress-track {
      position: relative;
      width: 340px;
      height: 5px;
      border-radius: 999px;
      /* 深色半透明底轨：浅色/深色桌面上都可辨识 */
      background: rgba(18, 16, 30, 0.55);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.07);
    }
    .progress-fill {
      position: relative;
      width: 0%; height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c3aed, #a78bfa 52%, #60a5fa);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.80), 0 0 26px rgba(96, 165, 250, 0.32);
      transition: width 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
      overflow: hidden;
    }
    .progress-shine {
      position: absolute; top: 0; bottom: 0; left: 0;
      width: 46%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
      transform: translateX(-130%);
      animation: progressShine 2.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes progressShine {
      0%        { transform: translateX(-130%); }
      62%, 100% { transform: translateX(330%); }
    }
    .progress-num {
      min-width: 46px;
      font-size: 15px; font-weight: 600;
      color: #e2d9ff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      text-shadow: 0 0 2px rgba(8, 6, 16, 0.9), 0 1px 10px rgba(8, 6, 16, 0.8);
    }

    /* ── 阶段信息 ── */
    .stage-msg {
      margin-top: 14px;
      min-height: 18px;
      font-size: 12.5px;
      letter-spacing: 0.14em;
      color: #c3cbdc;
      text-shadow: 0 1px 10px rgba(8, 6, 16, 0.85);
      transition: color 0.3s ease;
    }

    /* ── 失败状态 ── */
    body.error .progress-fill {
      background: linear-gradient(90deg, #b91c1c, #f87171);
      box-shadow: 0 0 12px rgba(248, 113, 113, 0.75);
    }
    body.error .progress-num { color: #ffc9c9; }
    body.error .launching   { color: #ffc9c9; }
    body.error .dots        { display: none; }
    body.error .stage-msg   { color: #ffb4b4; }
    body.error .halo-purple {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.16) 0%, transparent 70%);
    }
  </style>
</head>
<body>
  <!-- 背景柔光（非幕布：仅中央极淡光感） -->
  <div class="halo halo-purple"></div>
  <div class="halo halo-cyan"></div>

  <!-- 主舞台 -->
  <main class="stage">
    <h1 class="logo">CodeCraft</h1>

    <p class="launching">
      <span id="launchTxt">启动中</span><span class="dots"><i>.</i><i>.</i><i>.</i></span>
    </p>

    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"><span class="progress-shine"></span></div>
      </div>
      <span class="progress-num" id="progressNum">0%</span>
    </div>

    <p class="stage-msg" id="stageMsg">正在准备启动</p>
  </main>

  <script>
    (function () {
      var fill = document.getElementById('progressFill')
      var num = document.getElementById('progressNum')
      var msg = document.getElementById('stageMsg')
      var launchTxt = document.getElementById('launchTxt')
      var current = 0

      /** 渲染主进程推送的启动进度（只升不降） */
      function render (data) {
        if (!data) return

        if (typeof data.percent === 'number' && isFinite(data.percent)) {
          var next = Math.max(current, Math.min(100, Math.round(data.percent)))
          current = next
          fill.style.width = next + '%'
          num.textContent = next + '%'
        }

        if (typeof data.message === 'string' && data.message) {
          msg.textContent = data.message
        }

        if (data.error) {
          document.body.classList.add('error')
          if (launchTxt) launchTxt.textContent = '启动失败'
        }

        if (data.done) {
          if (current < 100) {
            current = 100
            fill.style.width = '100%'
            num.textContent = '100%'
          }
          document.body.classList.add('done')
        }
      }

      if (window.electronAPI && typeof window.electronAPI.onStartupProgress === 'function') {
        window.electronAPI.onStartupProgress(render)
      }
    })()
  </script>
</body>
</html>
