# ============================================================
# CodeCraft 自动发布工作流
# 触发条件：推送 v* 标签（如 v1.0.6）
# 自动构建 Win/Mac/Linux 三平台产物并创建 GitHub Release
# ============================================================

name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.3，不填则使用 tag，不要带 v 前缀）'
        required: false

permissions:
  contents: write

jobs:
  # ==================== Windows 构建 ====================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "📦 版本: $VER"

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步版本号
        shell: bash
        run: bash scripts/sync-version.sh "${{ steps.version.outputs.version }}"

      - name: Maven 构建
        run: mvn clean package -DskipTests -B

      - name: jlink 裁剪 JRE
        shell: cmd
        run: |
          if not exist "electron\jre\bin\java.exe" (
            echo 正在裁剪 JRE...
            "%JAVA_HOME%\bin\jlink.exe" ^
              --add-modules java.base,java.logging,java.sql,java.xml,java.naming,jdk.naming.dns,java.management,java.instrument,java.security.jgss,java.net.http,jdk.unsupported,java.scripting,java.compiler,java.desktop,jdk.crypto.cryptoki,jdk.security.auth,java.transaction.xa,java.rmi,java.management.rmi ^
              --strip-debug --compress 2 --no-header-files --no-man-pages ^
              --output electron\jre
          ) else (
            echo 内置 JRE 已存在，跳过
          )

      - name: Electron 打包 (Windows)
        run: |
          cd electron
          npm install
          npx electron-builder --win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 上传产物 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron/release/CodeCraft*Setup*.exe
          if-no-files-found: error

  # ==================== macOS 构建 ====================
  # 注意：x64 与 arm64 必须分别在对应架构的构建机上打包！
  # jlink 裁剪出的 JRE 架构取决于构建机架构——在 arm64 构建机上裁出的 JRE
  # 放进 x64 dmg 后，在 Intel Mac 上 java 无法执行（Bad CPU type），
  # 应用会卡在启动画面（此为历史故障根因）。
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel (x64) 构建机（如该标签不可用，可改为 macos-15-intel）
          - runner: macos-26-intel
            arch: x64
          # Apple Silicon (arm64) 构建机
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "📦 版本: $VER"

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步版本号
        run: bash scripts/sync-version.sh "${{ steps.version.outputs.version }}"

      - name: Maven 构建
        run: mvn clean package -DskipTests -B

      - name: jlink 裁剪 JRE (macOS ${{ matrix.arch }})
        run: |
          # 强制重新裁剪 JRE（确保是本机构架、本平台版本，而非其他平台/架构残留）
          rm -rf electron/jre
          echo "正在裁剪 JRE (arch=${{ matrix.arch }}, JAVA_HOME=$JAVA_HOME)..."
          "$JAVA_HOME/bin/jlink" \
            --add-modules java.base,java.logging,java.sql,java.xml,java.naming,jdk.naming.dns,java.management,java.instrument,java.security.jgss,java.net.http,jdk.unsupported,java.scripting,java.compiler,java.desktop,jdk.crypto.cryptoki,jdk.security.auth,java.transaction.xa,java.rmi,java.management.rmi \
            --strip-debug --compress 2 --no-header-files --no-man-pages \
            --output electron/jre
          # 确保 JRE 中所有可执行文件有正确的执行权限
          chmod +x electron/jre/bin/java
          chmod +x electron/jre/lib/jspawnhelper 2>/dev/null || true
          echo "✅ JRE 裁剪完成 (${{ matrix.arch }})"
          ls -lh electron/jre/bin/java
          file electron/jre/bin/java   # 打印架构，确认与目标一致

      - name: 生成 macOS 图标
        run: |
          if [ ! -f "electron/icon.icns" ]; then
            echo "正在生成 icon.icns..."
            ICONSET="$(mktemp -d)/icon.iconset"
            mkdir -p "$ICONSET"
            sips -z 16 16     electron/icon.png --out "$ICONSET/icon_16x16.png"         || true
            sips -z 32 32     electron/icon.png --out "$ICONSET/icon_16x16@2x.png"      || true
            sips -z 32 32     electron/icon.png --out "$ICONSET/icon_32x32.png"         || true
            sips -z 64 64     electron/icon.png --out "$ICONSET/icon_32x32@2x.png"      || true
            sips -z 128 128   electron/icon.png --out "$ICONSET/icon_128x128.png"       || true
            sips -z 256 256   electron/icon.png --out "$ICONSET/icon_128x128@2x.png"    || true
            sips -z 256 256   electron/icon.png --out "$ICONSET/icon_256x256.png"       || true
            sips -z 512 512   electron/icon.png --out "$ICONSET/icon_256x256@2x.png"    || true
            sips -z 512 512   electron/icon.png --out "$ICONSET/icon_512x512.png"       || true
            sips -z 1024 1024 electron/icon.png --out "$ICONSET/icon_512x512@2x.png"    || true
            iconutil -c icns "$ICONSET" -o electron/icon.icns 2>/dev/null || echo "⚠️ iconutil failed, skipping icns"
            rm -rf "$(dirname "$ICONSET")"
            ls -lh electron/icon.icns 2>/dev/null || echo "⚠️ icon.icns not generated"
          else
            echo "icon.icns 已存在，跳过"
          fi

      - name: 安装 Electron 依赖 (macOS)
        run: |
          cd electron
          npm ci || npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Electron 打包 (macOS ${{ matrix.arch }})
        run: |
          cd electron
          # 只构建当前 job 的目标架构；electron/jre 即本机原生裁剪出的对应架构
          npx electron-builder --mac --${{ matrix.arch }}
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 验证签名与 JRE 架构 (macOS ${{ matrix.arch }})
        run: |
          # ad-hoc 签名已由 electron-builder 的 afterPack 钩子在「dmg 生成之前」完成
          # （见 electron/afterPack.js），此处仅验证产物签名与 JRE 架构是否正确
          APP_PATH=$(find electron/release/mac* -name "CodeCraft.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "验证应用签名: $APP_PATH"
            codesign --verify --verbose=2 "$APP_PATH" 2>&1 && echo "✅ 签名验证通过" || echo "⚠️ 签名验证警告（请检查 afterPack 的签名日志）"
            codesign -dv "$APP_PATH" 2>&1 | head -8 || true
            echo "--- 内置 JRE 架构（应与 ${{ matrix.arch }} 一致）---"
            file "$APP_PATH/Contents/Resources/jre/bin/java"
          else
            echo "⚠️ 未找到 .app，跳过签名验证"
          fi

      - name: 上传产物 (macOS ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.arch }}
          path: electron/release/CodeCraft-*-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ==================== Linux 构建 ====================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "📦 版本: $VER"

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步版本号
        run: bash scripts/sync-version.sh "${{ steps.version.outputs.version }}"

      - name: Maven 构建
        run: mvn clean package -DskipTests -B

      - name: jlink 裁剪 JRE
        run: |
          if [ ! -d "electron/jre/bin" ]; then
            echo "正在裁剪 JRE..."
            "$JAVA_HOME/bin/jlink" \
              --add-modules java.base,java.logging,java.sql,java.xml,java.naming,jdk.naming.dns,java.management,java.instrument,java.security.jgss,java.net.http,jdk.unsupported,java.scripting,java.compiler,java.desktop,jdk.crypto.cryptoki,jdk.security.auth,java.transaction.xa,java.rmi,java.management.rmi \
              --strip-debug --compress 2 --no-header-files --no-man-pages \
              --output electron/jre
          else
            echo "内置 JRE 已存在，跳过"
          fi

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2 rpm
          echo "✅ 系统依赖已就绪"

      - name: 验证构建产物
        run: |
          echo "=== JAR 文件 ==="
          ls -lh target/*.jar 2>/dev/null || echo "❌ JAR 未找到"
          echo "=== electron/ 目录 ==="
          ls -lh electron/ 2>/dev/null || echo "❌ electron/ 不存在"
          echo "=== JRE ==="
          ls -lh electron/jre/bin/java 2>/dev/null || echo "⚠️ JRE 未裁剪"

      - name: 安装 Electron 依赖 (Linux)
        run: |
          cd electron
          npm ci || npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Electron 打包 (Linux)
        run: |
          cd electron
          npx electron-builder --linux
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 上传产物 (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            electron/release/CodeCraft-*.AppImage
            electron/release/CodeCraft-*.deb
          if-no-files-found: error

  # ==================== 创建 Release ====================
  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: 提取版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: 下载全部产物
        uses: actions/download-artifact@v4

      - name: 列出产物
        run: |
          echo "=== 所有产物 ==="
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -exec ls -lh {} \;

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: "CodeCraft v${{ steps.version.outputs.version }}"
          body: |
            ## 🚀 CodeCraft v${{ steps.version.outputs.version }}

            ### 📥 下载
            - **Windows**：下载 `CodeCraft-Setup-${{ steps.version.outputs.version }}.exe` 双击安装
            - **macOS（Apple Silicon / M 系列芯片）**：下载 `CodeCraft-${{ steps.version.outputs.version }}-arm64.dmg`，拖入 Applications，**首次打开请右键 → 打开**（见下方说明）
            - **macOS（Intel 芯片）**：下载 `CodeCraft-${{ steps.version.outputs.version }}-x64.dmg`，拖入 Applications，**首次打开请右键 → 打开**（见下方说明）
            - **Linux**：下载 `.AppImage` 或 `.deb`

            ### 🍎 macOS 用户必读
            由于未使用 Apple 付费开发者证书（$99/年），首次打开时会提示「无法验证开发者」。
            请按以下步骤操作：
            1. 将 `CodeCraft.app` 拖入 `Applications` 文件夹
            2. **右键（或 Control+点击）→ 打开**
            3. 在弹出的对话框中点击「打开」
            4. 之后再打开只需双击即可

            或者终端执行：
            ```
            xattr -cr /Applications/CodeCraft.app
            ```

            ### 💡 说明
            - 安装包自带 JRE 运行环境，无需安装 Java
              - 首次使用请在「配置」页面添加 LLM Provider（支持 DeepSeek/OpenAI/Anthropic/Ollama/MiMo 等）
            - 支持 Intel 和 Apple Silicon (M1/M2/M3) Mac

            > 📝 完整变更见 [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/master/CHANGELOG.md)
          files: |
            windows-installer/CodeCraft*Setup*.exe
            macos-installer-*/*.dmg
            linux-installer/*.AppImage
            linux-installer/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 重发版本时的清理步骤：历史构建中 macOS x64 dmg 曾使用「无架构后缀」命名
      # （CodeCraft-x.y.z.dmg），与修复后的新命名（CodeCraft-x.y.z-x64.dmg）不同名，
      # 不会被覆盖上传，需显式删除，避免用户从 Release 页面下载到旧的故障包。
      # 正常新版本发布时该资产不存在，命令会安全地空跑（不影响发布）。
      - name: 清理旧命名遗留产物 (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_NAME="CodeCraft-${{ steps.version.outputs.version }}.dmg"
          gh release delete-asset "v${{ steps.version.outputs.version }}" "$OLD_NAME" --yes \
            && echo "✅ 已清理旧命名产物: $OLD_NAME" \
            || echo "ℹ️ 旧命名产物不存在或未清理: $OLD_NAME（请人工确认 Release 资产列表）"
